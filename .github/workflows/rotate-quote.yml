name: rotate dev quote
on:
  schedule:
    # Every 3 hours — GitHub camo caches images, so rotate often
    - cron: "12 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "quotes.json"
      - "scripts/generate_quote_svg.py"
permissions:
  contents: write
jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate random quote SVG
        run: python scripts/generate_quote_svg.py
      - name: Commit if changed
        run: |
          git config user.name "Muhammad Nouman Shakeel"
          git config user.email "236772471+noumanshakeil@users.noreply.github.com"
          git add assets/dev-quote.svg
          if git diff --cached --quiet; then
            echo "Quote unchanged"
          else
            git commit -m "chore: rotate random dev quote"
            git pull --rebase origin main
            git push
          fi
