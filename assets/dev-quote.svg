<svg xmlns="http://www.w3.org/2000/svg" width="860" height="124" viewBox="0 0 860 124" role="img" aria-label="Dev quote">
  <rect width="100%" height="100%" rx="14" ry="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="36" y="50" fill="#79c0ff" font-size="18" font-family="Georgia, 'Times New Roman', serif" font-style="italic">&quot;Code is like humor. When you have to explain it, it’s bad.&quot;</text>
